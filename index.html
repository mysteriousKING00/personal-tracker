<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Tracker</title>
  <meta name="description" content="Local-first time, habit and goal tracker with weekly reports.">
  <meta name="theme-color" content="#1f4e79">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top no-print">
    <div class="brand"><img src="icon.svg" alt="" width="24" height="24"> Tracker</div>
    <nav hidden>
      <button data-view="day">Day</button>
      <button data-view="habits">Habits</button>
      <button data-view="tasks">Tasks</button>
      <button data-view="goals">Goals</button>
      <button data-view="dashboard">Dashboard</button>
      <button data-view="report">Weekly report</button>
      <button data-view="history">History</button>
      <button data-view="settings">Settings</button>
    </nav>
  </header>
  <div id="banner" class="banner no-print" hidden></div>
  <main id="view"></main>
  <footer class="no-print muted small">Data stays in this browser. Back it up from Settings.</footer>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
